name: Build CYRUS Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Platforms, NDK, and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build Native ARM64 Libretro Cores
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p .cores_build
          NDK_BUILD="$ANDROID_NDK_ROOT/ndk-build"

          build_ndk_core() {
            local name="$1"
            local repo="$2"
            local jni_subpath="$3"
            local out_name="$4"
            echo "=== Building $name ($repo) ==="
            git clone --depth 1 "$repo" ".cores_build/$name" || return 0
            local jni_dir=".cores_build/$name/$jni_subpath"
            if [ -f "$jni_dir/Android.mk" ]; then
              (cd "$jni_dir" && "$NDK_BUILD" APP_ABI=arm64-v8a APP_PLATFORM=android-26 -j$(nproc)) || echo "Warning: $name ndk-build failed"
              local built_so
              built_so=$(find ".cores_build/$name" -path "*/libs/arm64-v8a/*.so" | head -n 1)
              if [ -n "$built_so" ]; then
                cp "$built_so" "app/src/main/jniLibs/arm64-v8a/$out_name"
                echo "Bundled $out_name"
              fi
            else
              echo "No Android.mk at $jni_dir"
            fi
          }

          build_ndk_core "genesis_plus_gx" "https://github.com/libretro/Genesis-Plus-GX.git" "libretro/jni" "libretro_genesis_plus_gx.so"
          build_ndk_core "nestopia" "https://github.com/libretro/nestopia.git" "libretro/jni" "libretro_nestopia.so"
          build_ndk_core "snes9x" "https://github.com/libretro/snes9x.git" "libretro/jni" "libretro_snes9x.so"
          build_ndk_core "gambatte" "https://github.com/libretro/gambatte-libretro.git" "libgambatte/libretro/jni" "libretro_gambatte.so"
          build_ndk_core "pcsx_rearmed" "https://github.com/libretro/pcsx_rearmed.git" "jni" "libretro_pcsx_rearmed.so"

          # mGBA via CMake Libretro build for Android arm64-v8a
          echo "=== Building mGBA ==="
          git clone --depth 1 https://github.com/mgba-emu/mgba.git .cores_build/mgba || true
          if [ -d ".cores_build/mgba" ]; then
            cmake -S .cores_build/mgba -B .cores_build/mgba/build-android \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-26 \
              -DBUILD_LIBRETRO=ON \
              -DBUILD_QT=OFF \
              -DBUILD_SDL=OFF \
              -DBUILD_SHARED=ON \
              -DCMAKE_BUILD_TYPE=Release && \
            cmake --build .cores_build/mgba/build-android -j$(nproc) || echo "Warning: mGBA CMake build failed"
            MGBA_SO=$(find .cores_build/mgba/build-android -name "*mgba*libretro*.so" | head -n 1)
            if [ -n "$MGBA_SO" ]; then
              cp "$MGBA_SO" "app/src/main/jniLibs/arm64-v8a/libretro_mgba.so"
              echo "Bundled libretro_mgba.so"
            fi
          fi

          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload CYRUS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CYRUS-arm64-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
